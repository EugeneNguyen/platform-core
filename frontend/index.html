<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>platform-core</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Tabler v1.5.1 CSS — the project's only design system. AdminLTE (dependency, CSS
         import, and every AdminLTE-only widget's markup) has been fully removed; this
         stylesheet is placed after the module script purely to match the ordering the
         original AdminLTE->Tabler migration (ADR-0053/ADR-0054) established, now that
         Tabler is the only stylesheet loaded at all, ordering relative to main.tsx no
         longer matters for cascade purposes but is left unchanged rather than
         churned for its own sake. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.5.1/dist/css/tabler.min.css" />
    <!-- Tabler v1.5.1 JS — not vendored as the driver of any interactive state (that stays
         React-owned, see AppSidebar/AppHeader), loaded for parity with the CSS pin above. -->
    <script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.5.1/dist/js/tabler.min.js"></script>
  </body>
</html>
